

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic Chaos 3D</title>
<style>
body { margin:0; overflow:hidden; background:#87ceeb;
font-family:Arial; }
#ui { position:fixed;top:12px;left:12px;color:white;
font-size:20px;text-shadow:1px 2px 3px black; }
.controls {position:fixed;bottom:25px;width:100%;
display:flex;justify-content:space-around;}
button {font-size:24px;padding:18px 25px;
border:0;border-radius:15px;background:#ffffffbb;}
</style>
</head>
<body>
<div id="ui">🚗 Traffic Chaos 3D<br>Score: <span id="score">0</span></div>
<div class="controls">
<button id="left">⬅️</button>
<button id="brake">🛑</button>
<button id="right">➡️</button>
<button id="gas">⚡</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 30, 150);

const camera = new THREE.PerspectiveCamera(70,
innerWidth/innerHeight,0.1,300);
camera.position.set(0,7,12);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x667766,2));
const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,15,10);
scene.add(sun);

function cube(w,h,d,color,x,y,z) {
const mesh = new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color}));
mesh.position.set(x,y,z);
scene.add(mesh);
return mesh;
}

// City ground and road
cube(200,0.2,200,0x438447,0,-0.2,-70);
cube(14,0.15,200,0x333333,0,0,-70);

// Road lane markings
for(let z=20;z>-170;z-=12) {
cube(0.18,0.04,5,0xffffff,0,0.1,z);
}

// Simple buildings
for(let z=15;z>-150;z-=18) {
for(let side of [-1,1]) {
let h=8+Math.random()*20;
cube(7,h,9,
[0xb8b1a3,0xc7a78d,0x999eaa][Math.floor(Math.random()*3)],
side*13,h/2,z);
}
}

// 🚗 PLAYER CAR
const car = new THREE.Group();

// Main body
const body = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.65, 4.2),
  new THREE.MeshStandardMaterial({color: 0x1685ff})
);
body.position.y = 0.75;
car.add(body);

// Hood
const hood = new THREE.Mesh(
  new THREE.BoxGeometry(2.05, 0.25, 1.2),
  new THREE.MeshStandardMaterial({color: 0x126bd1})
);
hood.position.set(0, 1.05, -1.35);
car.add(hood);

// Cabin
const cabin = new THREE.Mesh(
  new THREE.BoxGeometry(1.65, 0.75, 1.9),
  new THREE.MeshStandardMaterial({
    color: 0x182536,
    metalness: 0.4,
    roughness: 0.25
  })
);
cabin.position.set(0, 1.25, 0.15);
car.add(cabin);

// Wheels
function wheel(x,z) {
  const w = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42,0.42,0.3,24),
    new THREE.MeshStandardMaterial({color:0x111111})
  );

  w.rotation.z = Math.PI / 2;
  w.position.set(x,0.45,z);
  car.add(w);
}

wheel(-1.15,-1.35);
wheel(1.15,-1.35);
wheel(-1.15,1.35);
wheel(1.15,1.35);

// Headlights
function light(x) {
  const l = new THREE.Mesh(
    new THREE.BoxGeometry(0.45,0.18,0.08),
    new THREE.MeshStandardMaterial({
      color:0xffffcc,
      emissive:0xffffaa,
      emissiveIntensity:2
    })
  );

  l.position.set(x,0.9,-2.13);
  car.add(l);
}

light(-0.65);
light(0.65);

// Tail lights
function tail(x) {
  const l = new THREE.Mesh(
    new THREE.BoxGeometry(0.45,0.18,0.08),
    new THREE.MeshStandardMaterial({
      color:0xff0000,
      emissive:0xff0000,
      emissiveIntensity:1.5
    })
  );

  l.position.set(x,0.9,2.13);
  car.add(l);
}

tail(-0.65);
tail(0.65);

scene.add(car);

// 🚦 TRAFFIC SYSTEM
const traffic = [];

const trafficColors = [
  0xff3333, // Red
  0xffffff, // White
  0x222222, // Black
  0xffcc22, // Yellow
  0x22bb88, // Green
  0x8844ff  // Purple
];

const lanes = [-4, 0, 4];

function createTrafficCar(i) {

  const vehicle = new THREE.Group();

  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.7, 4),
    new THREE.MeshStandardMaterial({
      color: trafficColors[i % trafficColors.length]
    })
  );

  body.position.y = 0.7;
  vehicle.add(body);

  // Cabin
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.7, 1.8),
    new THREE.MeshStandardMaterial({
      color: 0x202733,
      roughness: 0.3,
      metalness: 0.3
    })
  );

  cabin.position.set(0, 1.2, 0);
  vehicle.add(cabin);

  // Wheels
  function addWheel(x, z) {

    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.4,
        0.4,
        0.3,
        16
      ),
      new THREE.MeshStandardMaterial({
        color: 0x111111
      })
    );

    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.4, z);

    vehicle.add(wheel);
  }

  addWheel(-1.1, -1.3);
  addWheel(1.1, -1.3);
  addWheel(-1.1, 1.3);
  addWheel(1.1, 1.3);

  // Headlights
  function addLight(x) {

    const light = new THREE.Mesh(
      new THREE.BoxGeometry(0.4, 0.18, 0.08),
      new THREE.MeshStandardMaterial({
        color: 0xffffcc,
        emissive: 0xffffaa,
        emissiveIntensity: 1.5
      })
    );

    light.position.set(x, 0.9, -2.03);
    vehicle.add(light);
  }

  addLight(-0.65);
  addLight(0.65);

  // Random lane
  vehicle.position.x =
    lanes[Math.floor(Math.random() * lanes.length)];

  vehicle.position.y = 0;
  vehicle.position.z = -30 - i * 18;

  // Individual speed
  vehicle.userData.speed =
    0.35 + Math.random() * 0.45;

  vehicle.userData.targetLane =
    vehicle.position.x;

  scene.add(vehicle);
  traffic.push(vehicle);
}


// Create 12 traffic vehicles
for (let i = 0; i < 12; i++) {
  createTrafficCar(i);
}
let steer=0, speed=0.5, score=0, crashed=false;
function hold(id,down,up) {
const b=document.getElementById(id);
b.addEventListener('pointerdown',e=>{
e.preventDefault(); down();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>
b.addEventListener(ev,up));
}
hold('left',()=>steer=-1,()=>steer=0);
hold('right',()=>steer=1,()=>steer=0);
hold('gas',()=>speed=1.2,()=>speed=0.5);
hold('brake',()=>speed=0.2,()=>speed=0.5);

function animate() {
requestAnimationFrame(animate);
if(!crashed) {
car.position.x+=steer*0.13;
car.position.x=Math.max(-5,Math.min(5,car.position.x));

traffic.forEach(t => {

  // Move vehicle
  t.position.z += t.userData.speed;

  // Small random lane change
  if (Math.random() < 0.002) {

    t.userData.targetLane =
      lanes[Math.floor(Math.random() * lanes.length)];
  }

  // Smooth lane movement
  t.position.x +=
    (t.userData.targetLane - t.position.x) * 0.01;

  // Vehicle passed player
  if (t.position.z > 15) {

    t.position.z =
      -180 - Math.random() * 80;

    t.position.x =
      lanes[Math.floor(Math.random() * lanes.length)];

    t.userData.targetLane = t.position.x;

    t.userData.speed =
      0.35 + Math.random() * 0.45;

    score++;

    document.getElementById("score").textContent =
      score;
  }

  // Collision detection
  if (
    Math.abs(t.position.z - car.position.z) < 3.2 &&
    Math.abs(t.position.x - car.position.x) < 1.8
  ) {

    crashed = true;

    document.getElementById("ui").innerHTML =
      "💥 CRASH!<br>" +
      "Score: " + score +
      '<br><button onclick="location.reload()">Restart</button>';
  }

});
camera.position.x+=(car.position.x-camera.position.x)*0.06;
camera.lookAt(car.position.x,0,-10);
renderer.render(scene,camera);
}
animate();
window.addEventListener('resize',()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
