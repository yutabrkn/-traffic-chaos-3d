<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Traffic Chaos 3D</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#ui {
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10;
  color: white;
  font-size: 20px;
  font-weight: bold;
  text-shadow: 2px 2px 4px #000;
}

.controls {
  position: fixed;
  bottom: 20px;
  left: 0;
  width: 100%;
  z-index: 10;
  display: flex;
  justify-content: space-around;
}

button {
  width: 65px;
  height: 65px;
  border: none;
  border-radius: 50%;
  font-size: 25px;
  background: rgba(255,255,255,0.8);
}
</style>
</head>

<body>

<div id="ui">
🚗 Traffic Chaos 3D<br>
Score: <span id="score">0</span>
</div>

<div class="controls">
<button id="left">⬅️</button>
<button id="brake">🛑</button>
<button id="right">➡️</button>
<button id="gas">⚡</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// ================================
// GAME SETUP
// ================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87ceeb);

scene.fog = new THREE.Fog(
  0x87ceeb,
  30,
  160
);


// CAMERA
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);

camera.position.set(0, 7, 12);


// RENDERER
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(
  renderer.domElement
);


// ================================
// LIGHTS
// ================================

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x667766,
    2
  )
);

const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sun.position.set(
  -10,
  20,
  10
);

scene.add(sun);


// ================================
// HELPER
// ================================

function makeCube(
  width,
  height,
  depth,
  color,
  x,
  y,
  z
) {

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),
      new THREE.MeshStandardMaterial({
        color: color
      })
    );

  mesh.position.set(
    x,
    y,
    z
  );

  scene.add(mesh);

  return mesh;
}


// ================================
// GROUND
// ================================

makeCube(
  200,
  0.2,
  200,
  0x438447,
  0,
  -0.2,
  -70
);


// ================================
// ROAD
// ================================

makeCube(
  14,
  0.15,
  200,
  0x303030,
  0,
  0,
  -70
);


// ROAD LINES

for (
  let z = 20;
  z > -180;
  z -= 12
) {

  makeCube(
    0.18,
    0.04,
    5,
    0xffffff,
    0,
    0.1,
    z
  );

}


// ================================
// BUILDINGS
// ================================

for (
  let z = 15;
  z > -150;
  z -= 18
) {

  for (
    let side of [-1, 1]
  ) {

    const height =
      8 + Math.random() * 18;

    const colors = [
      0xb8b1a3,
      0xc7a78d,
      0x999eaa
    ];

    makeCube(
      7,
      height,
      9,
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ],
      side * 13,
      height / 2,
      z
    );

  }

}


// ================================
// PLAYER CAR
// ================================

const car =
  new THREE.Group();


// BODY

const carBody =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      2.2,
      0.65,
      4.2
    ),
    new THREE.MeshStandardMaterial({
      color: 0x1685ff
    })
  );

carBody.position.y = 0.75;

car.add(carBody);


// CABIN

const carCabin =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.65,
      0.75,
      1.9
    ),
    new THREE.MeshStandardMaterial({
      color: 0x182536
    })
  );

carCabin.position.set(
  0,
  1.25,
  0.15
);

car.add(carCabin);


// WHEELS

function createWheel(x, z) {

  const wheel =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        0.42,
        0.42,
        0.3,
        20
      ),
      new THREE.MeshStandardMaterial({
        color: 0x111111
      })
    );

  wheel.rotation.z =
    Math.PI / 2;

  wheel.position.set(
    x,
    0.45,
    z
  );

  car.add(wheel);
}

createWheel(-1.15, -1.35);
createWheel(1.15, -1.35);
createWheel(-1.15, 1.35);
createWheel(1.15, 1.35);


// HEADLIGHTS

function createHeadlight(x) {

  const light =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        0.45,
        0.18,
        0.08
      ),
      new THREE.MeshStandardMaterial({
        color: 0xffffcc,
        emissive: 0xffffaa,
        emissiveIntensity: 2
      })
    );

  light.position.set(
    x,
    0.9,
    -2.13
  );

  car.add(light);
}

createHeadlight(-0.65);
createHeadlight(0.65);


// ADD PLAYER

scene.add(car);


// ================================
// TRAFFIC CARS
// ================================

const traffic = [];

const lanes = [
  -4,
  0,
  4
];


function createTrafficCar(
  index
) {

  const vehicle =
    new THREE.Group();


  const colors = [
    0xff3333,
    0xffffff,
    0x222222,
    0xffcc22,
    0x22bb88
  ];


  // BODY

  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2.2,
        0.7,
        4
      ),
      new THREE.MeshStandardMaterial({
        color:
          colors[
            index % colors.length
          ]
      })
    );

  body.position.y = 0.7;

  vehicle.add(body);


  // CABIN

  const cabin =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.6,
        0.7,
        1.8
      ),
      new THREE.MeshStandardMaterial({
        color: 0x202733
      })
    );

  cabin.position.y = 1.2;

  vehicle.add(cabin);


  // WHEELS

  function wheel(x, z) {

    const w =
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          0.4,
          0.4,
          0.3,
          16
        ),
        new THREE.MeshStandardMaterial({
          color: 0x111111
        })
      );

    w.rotation.z =
      Math.PI / 2;

    w.position.set(
      x,
      0.4,
      z
    );

    vehicle.add(w);
  }


  wheel(-1.1, -1.3);
  wheel(1.1, -1.3);
  wheel(-1.1, 1.3);
  wheel(1.1, 1.3);


  // POSITION

  vehicle.position.x =
    lanes[
      index % lanes.length
    ];

  vehicle.position.z =
    -30 - index * 18;


  vehicle.userData.speed =
    0.35 +
    Math.random() * 0.35;


  scene.add(vehicle);

  traffic.push(vehicle);
}


// CREATE 10 CARS

for (
  let i = 0;
  i < 10;
  i++
) {

  createTrafficCar(i);

}


// ================================
// CONTROLS
// ================================

let steer = 0;

let speed = 0.5;

let score = 0;

let crashed = false;


function buttonControl(
  id,
  direction
) {

  const button =
    document.getElementById(id);


  button.addEventListener(
    "pointerdown",
    function(e) {

      e.preventDefault();

      direction();

    }
  );


  button.addEventListener(
    "pointerup",
    function() {

      steer = 0;

      speed = 0.5;

    }
  );


  button.addEventListener(
    "pointercancel",
    function() {

      steer = 0;

    }
  );
}


buttonControl(
  "left",
  function() {

    steer = -1;

  }
);


buttonControl(
  "right",
  function() {

    steer = 1;

  }
);


buttonControl(
  "gas",
  function() {

    speed = 1.2;

  }
);


buttonControl(
  "brake",
  function() {

    speed = 0.15;

  }
);


// ================================
// GAME LOOP
// ================================

function animate() {

  requestAnimationFrame(
    animate
  );


  if (!crashed) {


    // PLAYER STEERING

    car.position.x +=
      steer * 0.13;


    car.position.x =
      Math.max(
        -5,
        Math.min(
          5,
          car.position.x
        )
      );


    // TRAFFIC

    traffic.forEach(
      function(vehicle) {


        vehicle.position.z +=
          vehicle.userData.speed *
          speed;


        // RESET CAR

        if (
          vehicle.position.z >
          15
        ) {

          vehicle.position.z =
            -180 -
            Math.random() * 80;


          vehicle.position.x =
            lanes[
              Math.floor(
                Math.random() *
                lanes.length
              )
            ];


          vehicle.userData.speed =
            0.35 +
            Math.random() * 0.35;


          score++;


          document.getElementById(
            "score"
          ).textContent =
            score;

        }


        // COLLISION

        if (
          Math.abs(
            vehicle.position.z -
            car.position.z
          ) < 3.2
          &&
          Math.abs(
            vehicle.position.x -
            car.position.x
          ) < 1.8
        ) {

          crashed = true;


          document.getElementById(
            "ui"
          ).innerHTML =
            "💥 CRASH!<br>" +
            "Score: " +
            score +
            "<br>" +
            "<button onclick='location.reload()'>" +
            "🔄" +
            "</button>";

        }

      }
    );

  }


  // CAMERA

  camera.position.x +=
    (
      car.position.x -
      camera.position.x
    ) * 0.06;


  camera.lookAt(
    car.position.x,
    0,
    -10
  );


  renderer.render(
    scene,
    camera
  );
}


animate();


// ================================
// SCREEN RESIZE
// ================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
